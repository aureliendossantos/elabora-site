name: Publish release notes
# Started by the app's « Release app » workflow (SITE_DISPATCH_TOKEN: Actions write on this repository only) or
# by hand. The version only names what to expect: the records are read from the public assets repository.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The app version just published (empty to resync every public release)
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: site-release-notes
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e "for(const name of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID'])if(!process.env[name])throw new Error('Missing site configuration: '+name)"
      - run: pnpm install --frozen-lockfile
      - name: Import published records (the dispatch's version is not a data source)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          pnpm run releases:sync
          node scripts/releases.mjs expect "$VERSION"
      - run: pnpm run check
      # A comparison fact past its validity is a warning here: a release is never held back by it (docs/maintenance.md, « Comparison pages »).
      - run: pnpm test
        env:
          COMPARISONS_STALE: warn
      - run: pnpm run build
      - name: Keep the source snapshot in step with publication
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/data/releases.json
          if ! git diff --cached --quiet; then
            git commit -m "Update published release notes"
            git push origin HEAD:main
          fi
      - name: Deploy the verified site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm run releases:guard
          pnpm exec wrangler deploy
      - run: pnpm run schemas:verify
